syntax = "proto3";
package tac;
option go_package = "github.com/Lyoomu/TAC/proto";
service DiscoveryService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetServerInfo(ServerInfoRequest) returns (ServerInfoResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetRole(GetRoleRequest) returns (Role);
  rpc GetRoleTools(GetRoleToolsRequest) returns (GetRoleToolsResponse);
}
message PingRequest {
  string client_version = 1;
}
message PingResponse {
  string server_name = 1;
  string server_version = 2;
  string certificate_fingerprint = 3; 
}
message ServerInfoRequest {}
message ServerInfoResponse {
  string server_name = 1;
  string server_version = 2;
  int32 role_count = 3;
  int32 tool_count = 4;
  string api_version = 5;
}
message ListRolesRequest {}
message ListRolesResponse {
  repeated Role roles = 1;
}
message GetRoleRequest {
  string name = 1;
}
message Role {
  string name = 1;
  string description = 2;
  repeated string components = 3;
  repeated string tools = 4;
  map<string, string> env = 5;
  string api_type = 6;
  string message_mode = 7; 
  string created_at = 8;
  string updated_at = 9;
  string model = 10;
}
message GetRoleToolsRequest {
  string role_name = 1;
}
message GetRoleToolsResponse {
  repeated ToolInfo tools = 1;
}
message ToolInfo {
  string name = 1;
  string description = 2;
  string language = 3;           
  string version = 4;
  repeated string dependencies = 5;  
  bool requires_compilation = 6;
  bool is_binary = 7;            
  bool source_available = 8;     
  string runtime_requirement = 9; 
  repeated string files = 10;    
}
service ChatService {
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}
message ChatMessage {
  string message_id = 1;
  string role = 2;
  string content = 3;
  string message_type = 4;
  string tool_name = 5;
  string tool_call_id = 6;       
  string tool_arguments = 7;     
  string tool_result = 8;        
  bool is_history = 9;
  bool end_of_turn = 10;
  string error_message = 11;
  string role_name = 12;
  string session_id = 13;
  string timestamp = 14;
  string message_mode = 15;
}
service ToolService {
  rpc DownloadTool(DownloadToolRequest) returns (stream ToolChunk);
}
message DownloadToolRequest {
  string tool_name = 1;
  bool download_source = 2;
  bool download_binary = 3;
}
message ToolChunk {
  bytes data = 1;
  string file_name = 2;          
  bool is_source = 3;            
  bool is_last = 4;              
  bool is_last_file = 5;         
  string warning_message = 6;    
}
service DaemonService {
  rpc Ping(DaemonPingRequest) returns (DaemonPingResponse);
  rpc StartTrigger(TriggerIDRequest) returns (TriggerResponse);
  rpc StopTrigger(TriggerIDRequest) returns (TriggerResponse);
  rpc RunTrigger(TriggerIDRequest) returns (TriggerResponse);
  rpc ListTriggers(Empty) returns (TriggerListResponse);
  rpc ListEvents(Empty) returns (EventListResponse);
  rpc GetTriggerEvents(TriggerIDRequest) returns (EventListResponse);
  rpc CreateTrigger(CreateTriggerRequest) returns (TriggerResponse);
  rpc UpdateTrigger(UpdateTriggerRequest) returns (TriggerResponse);
  rpc DeleteTrigger(TriggerIDRequest) returns (TriggerResponse);
  rpc CreateEvent(CreateEventRequest) returns (EventResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (EventResponse);
  rpc DeleteEvent(EventIDRequest) returns (EventResponse);
  rpc ListEnvPresets(Empty) returns (EnvPresetListResponse);
  rpc CreateEnvPreset(CreateEnvPresetRequest) returns (EnvPresetResponse);
  rpc UpdateEnvPreset(UpdateEnvPresetRequest) returns (EnvPresetResponse);
  rpc DeleteEnvPreset(EnvPresetIDRequest) returns (EnvPresetResponse);
  rpc GetDaemonStatus(Empty) returns (DaemonStatusResponse);
  rpc Shutdown(Empty) returns (Empty);
  rpc ListActiveSessions(Empty) returns (ActiveSessionListResponse);
  rpc WatchSession(WatchSessionRequest) returns (stream ChatMessage);
}
message DaemonPingRequest {}
message DaemonPingResponse {
  string daemon_version = 1;
  string workspace = 2;
  int32 running_triggers = 3;
}
message TriggerIDRequest {
  string trigger_id = 1;
}
message TriggerResponse {
  bool success = 1;
  string message = 2;
}
message Empty {}
message TriggerListResponse {
  repeated DaemonTrigger triggers = 1;
}
message EventListResponse {
  repeated DaemonEvent events = 1;
}
message DaemonTrigger {
  string id = 1;
  string name = 2;
  string trigger_type = 3;
  string description = 4;
  bool enabled = 5;
  bool running = 6;
  int32 event_count = 7;
  string interval = 8;
  string cron_expr = 9;
  string watch_path = 10;
}
message DaemonEvent {
  string id = 1;
  string name = 2;
  string role_key = 3;
  string session_mode = 4;
  int32 env_count = 5;
  string env_preset = 6;
}
message DaemonStatusResponse {
  bool running = 1;
  string workspace = 2;
  int32 trigger_count = 3;
  int32 event_count = 4;
  int32 running_trigger_count = 5;
  string uptime = 6;
}
message CreateTriggerRequest {
  string id = 1;
  string name = 2;
  string trigger_type = 3;
  string description = 4;
  string interval = 5;
  string cron_expr = 6;
  string watch_path = 7;
  bool recursive = 8;
  repeated string event_ids = 9;
}
message UpdateTriggerRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string interval = 4;
  string cron_expr = 5;
  string watch_path = 6;
  bool recursive = 7;
  repeated string event_ids = 8;
}
message CreateEventRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string role_key = 4;
  string initial_msg = 5;
  string session_mode = 6;
  string message_mode = 7;
  map<string, string> env = 8;
  string env_preset = 9;
}
message UpdateEventRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string role_key = 4;
  string initial_msg = 5;
  string session_mode = 6;
  string message_mode = 7;
  map<string, string> env = 8;
  string env_preset = 9;
  bool set_message_mode = 10;
  bool set_env_preset = 11;
  bool set_env = 12;
}
message EventIDRequest {
  string event_id = 1;
}
message EventResponse {
  bool success = 1;
  string message = 2;
}
message EnvPreset {
  string name = 1;
  string description = 2;
  map<string, string> env = 3;
  string created_at = 4;
  string updated_at = 5;
}
message EnvPresetListResponse {
  repeated EnvPreset presets = 1;
}
message CreateEnvPresetRequest {
  string name = 1;
  string description = 2;
  map<string, string> env = 3;
}
message UpdateEnvPresetRequest {
  string name = 1;
  string description = 2;
  map<string, string> env = 3;
  bool set_description = 4;
  bool set_env = 5;
}
message EnvPresetIDRequest {
  string name = 1;
}
message EnvPresetResponse {
  bool success = 1;
  string message = 2;
}

message ActiveSessionInfo {
  string session_id = 1;
  string server_name = 2;
  string role_name = 3;
  string trigger_id = 4;
  string event_id = 5;
  int64 start_time_unix = 6;
}

message ActiveSessionListResponse {
  repeated ActiveSessionInfo sessions = 1;
}

message WatchSessionRequest {
  string server_name = 1;
  string role_name = 2;
  string session_id = 3;
}

